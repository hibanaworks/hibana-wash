name: quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  guest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup target add --toolchain stable wasm32-wasip1
      - run: |
          cargo +stable fmt --check
          cargo +stable test --locked --lib
          sh scripts/build.sh
          cargo +stable clippy --locked --target wasm32-wasip1 --release -- -D warnings
          python3 tools/profile.py target/wasm32-wasip1/release/hibana-wash.wasm > profile.json
          python3 -c 'import json; p=json.load(open("profile.json")); assert not p["non_wasi_imports"]; assert p["memories"] == [{"flags": 0, "minimum": 1}]'
